<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba de Carrusel 1080</title>
<style>
  body {
    background-color: #0b1c3a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .carrusel-prueba {
    position: relative;
    width: 90%;
    max-width: 400px;
    aspect-ratio: 1/1;
    overflow: hidden;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    background: #000;
    border: 3px solid #fbbf24;
    cursor: pointer; /* Aquí aparece la manito */
    transition: transform 0.3s ease;
  }
  .carrusel-prueba:hover {
    transform: scale(1.02); /* Un efecto bonito al pasar el mouse */
  }
  .carrusel-prueba img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>

  <!-- Aquí envolvemos la imagen en un enlace con la dirección del negocio -->
  <a href="https://restauranteelsabordedonarosa.netlify.app/" target="_blank" class="carrusel-prueba">
    <img src="prueba.jpg" alt="El Sabor de Doña Rosa">
  </a>

</body>
</html>
