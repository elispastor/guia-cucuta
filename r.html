<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirigiendo...</title>
<style>
  body { background: linear-gradient(145deg, #0a1a2e, #1a2f44); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; text-align: center; padding: 20px; }
  .box { max-width: 400px; }
  .box h1 { color: #fbbf24; font-size: 1.5rem; margin-bottom: 12px; }
  .box p { color: #a0c4e8; font-size: 14px; }
  .spinner { width: 40px; height: 40px; border: 4px solid rgba(251,191,36,0.3); border-top-color: #fbbf24; border-radius: 50%; margin: 20px auto; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h1>🐙 Redirigiendo...</h1>
  <p>Un momento, te estamos llevando al formulario de registro.</p>
</div>

<script>
// Detectar el código de referido desde la URL
var path = window.location.pathname;
var partes = path.split('/');
var codigo = partes[partes.length - 1] || '';

// Si el código está vacío, buscar en query string
if (!codigo || codigo === 'r' || codigo === 'r.html') {
  var params = new URLSearchParams(window.location.search);
  codigo = params.get('codigo') || params.get('ref') || '';
}

// Redirigir al formulario con el ref
if (codigo) {
  window.location.href = '/registro.html?ref=' + encodeURIComponent(codigo);
} else {
  window.location.href = '/registro.html';
}
</script>
</body>
</html>
